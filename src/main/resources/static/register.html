
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA BANK - Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b1f4d, #1677d2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #123b75;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 5px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1677d2;
        }

        .error {
            color: #d93025;
            font-size: 13px;
            margin-bottom: 12px;
            min-height: 0;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 7px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .success {
            display: block;
            color: #155724;
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .failure {
            display: block;
            color: #721c24;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #1266c5;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0b4388;
        }

        button:disabled {
            background: #789bc2;
            cursor: not-allowed;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-link a {
            color: #1266c5;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #1266c5;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>NOVA BANK</h1>
    <p class="subtitle">Create Your Account</p>

    <div id="formMessage" class="message" role="status"
         aria-live="polite"></div>

    <form id="registerForm">

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName"
               required autocomplete="name">
        <p class="error" id="nameError"></p>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               required autocomplete="email">
        <p class="error" id="emailError"></p>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone"
               required maxlength="10" inputmode="numeric"
               autocomplete="tel">
        <p class="error" id="phoneError"></p>

        <label for="address">Address</label>
        <input type="text" id="address" name="address"
               required autocomplete="street-address">
        <p class="error" id="addressError"></p>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               required minlength="8" autocomplete="new-password">
        <p class="error" id="passwordError"></p>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword"
               name="confirmPassword" required
               minlength="8" autocomplete="new-password">
        <p class="error" id="confirmPasswordError"></p>

        <button type="submit" id="registerButton">Register</button>

    </form>

    <p class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </p>

    <a href="index.html" class="home-link">Back to Home</a>

</div>

<script>

    const form = document.getElementById("registerForm");

    const fullName = document.getElementById("fullName");
    const email = document.getElementById("email");
    const phone = document.getElementById("phone");
    const address = document.getElementById("address");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");

    const message = document.getElementById("formMessage");
    const registerButton = document.getElementById("registerButton");

    function showError(id, text) {
        document.getElementById(id).textContent = text;
    }

    function clearMessage() {
        message.textContent = "";
        message.className = "message";
    }

    // Full name: allow letters and special characters, not numbers.
    function validateName() {
        const value = fullName.value.trim();

        if (value === "") {
            showError("nameError", "Please enter your full name.");
            return false;
        }

        if (/\d/.test(value)) {
            showError("nameError", "Numbers are not allowed in the name.");
            return false;
        }

        showError("nameError", "");
        return true;
    }

    // Email validation.
    function validateEmail() {
        if (!email.validity.valid || email.value.trim() === "") {
            showError("emailError", "Please enter a valid email address.");
            return false;
        }

        showError("emailError", "");
        return true;
    }

    // Mobile number: exactly 10 digits.
    function validatePhone() {
        if (!/^[0-9]{10}$/.test(phone.value)) {
            showError("phoneError", "Enter exactly 10 digits.");
            return false;
        }

        showError("phoneError", "");
        return true;
    }

    // Password: uppercase, lowercase, number and special character.
    function validatePassword() {
        const pattern =
            /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}$/;

        if (!pattern.test(password.value)) {
            showError(
                "passwordError",
                "Use 8+ characters with uppercase, lowercase, number and special character."
            );
            return false;
        }

        showError("passwordError", "");
        return true;
    }

    // Confirm password.
    function validateConfirmPassword() {
        if (confirmPassword.value === "") {
            showError(
                "confirmPasswordError",
                "Please confirm your password."
            );
            return false;
        }

        if (password.value !== confirmPassword.value) {
            showError(
                "confirmPasswordError",
                "Passwords do not match."
            );
            return false;
        }

        showError("confirmPasswordError", "");
        return true;
    }

    // Address.
    function validateAddress() {
        if (address.value.trim() === "") {
            showError("addressError", "Please enter your address.");
            return false;
        }

        showError("addressError", "");
        return true;
    }

    fullName.addEventListener("input", validateName);
    email.addEventListener("input", validateEmail);
    phone.addEventListener("input", validatePhone);
    address.addEventListener("input", validateAddress);

    password.addEventListener("input", function() {
        validatePassword();

        if (confirmPassword.value !== "") {
            validateConfirmPassword();
        }
    });

    confirmPassword.addEventListener("input", validateConfirmPassword);

    form.addEventListener("submit", async function(event) {

        event.preventDefault();
        clearMessage();

        const valid =
            validateName() &
            validateEmail() &
            validatePhone() &
            validateAddress() &
            validatePassword() &
            validateConfirmPassword();

        if (!valid) {
            return;
        }

        registerButton.disabled = true;
        registerButton.textContent = "Registering...";

        try {
            const response = await fetch("/register", {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded;charset=UTF-8"
                },
                body: new URLSearchParams(new FormData(form))
            });

            const result = await response.text();

            if (response.ok) {
                message.textContent =
                    "Registration Successful! Your account has been created.";

                message.className = "message success";

                form.reset();

                document.querySelectorAll(".error").forEach(function(error) {
                    error.textContent = "";
                });

            } else {
                message.textContent = result || "Registration failed.";
                message.className = "message failure";
            }

        } catch (error) {
            message.textContent =
                "Unable to connect to the server. Please try again.";

            message.className = "message failure";

        } finally {
            registerButton.disabled = false;
            registerButton.textContent = "Register";
        }

    });

</script>

</body>
</html>
