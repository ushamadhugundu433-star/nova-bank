
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA BANK - Deposit Money</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #123c69;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0b2948;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #123c69;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>NOVA BANK</h1>
    <h2>Deposit Money</h2>

    <form id="depositForm">

        <label for="amount">Enter Deposit Amount (₹)</label>

        <input
            type="number"
            id="amount"
            name="amount"
            min="0.01"
            step="0.01"
            placeholder="Enter amount"
            required
        >

        <button type="submit">Deposit Money</button>

    </form>

    <p id="message"></p>

    <a href="/dashboard.html">Back to Dashboard</a>

</div>

<script>

document.getElementById("depositForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const amount = document.getElementById("amount").value;
    const message = document.getElementById("message");

    try {

        const response = await fetch("/deposit", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams({
                amount: amount
            })
        });

        const result = await response.json();

        message.textContent = result.message;

        if (response.ok) {
            message.textContent += " New Balance: ₹" + result.newBalance;
            message.style.color = "green";
            document.getElementById("depositForm").reset();
        } else {
            message.style.color = "red";
        }

    } catch (error) {
        message.textContent = "Something went wrong. Please try again.";
        message.style.color = "red";
    }

});

</script>

</body>
</html>
