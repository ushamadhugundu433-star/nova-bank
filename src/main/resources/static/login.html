
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA BANK - Customer Login</title>

    <link rel="stylesheet" href="/css/bank-style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #09264d, #1769b8);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }

        .login-logo {
            text-align: center;
            color: #123b72;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .login-container form {
            margin: 0;
            padding: 0;
            box-shadow: none;
            max-width: none;
        }

        .login-container button {
            width: 100%;
            margin-top: 10px;
        }

        .login-links {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        .login-links p {
            margin-top: 14px;
        }

        .login-links a {
            color: #1769d2;
            text-decoration: none;
            font-weight: 600;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #1769d2;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1 class="login-logo">NOVA BANK</h1>

        <p class="login-subtitle">
            Welcome back! Please login to your account.
        </p>

        <form action="/login" method="POST">

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <div class="login-links">

            <p>
                Don't have an account?
                <a href="/register.html">Register here</a>
            </p>

        </div>

        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </div>

</body>
</html>
